services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres-container
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C --data-checksums"
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    shm_size: 256mb

  mysql:
    image: mysql:8.4
    container_name: mysql-latest
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: test
      MYSQL_USER: test
      MYSQL_PASSWORD: 123456
    volumes:
      - mysql_data:/var/lib/mysql

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes

  velxio:
    image: ghcr.io/davidmonterocrespo24/velxio:master
    container_name: velxio
    restart: unless-stopped
    ports:
      - "3080:80"
    volumes:
      - velxio-data:/app/data
      - velxio-arduino-libs:/root/.arduino15
      - velxio-arduino-user-libs:/root/Arduino
      - velxio-ccache:/var/cache/ccache
      - velxio-build:/var/lib/velxio-build

volumes:
  pgdata:
  mysql_data:
  qdrant_data:
  velxio-data:
  velxio-arduino-libs:
  velxio-arduino-user-libs:
  velxio-ccache:
  velxio-build:
